<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Inner Compass Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="6" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="150" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.8" stroke-width="8" filter="url(#shadow)" />
  <!-- Cardinal Points -->
  <polygon points="256,126 270,240 256,230 242,240" fill="#f87171" filter="url(#shadow)" />
  <polygon points="256,386 270,272 256,282 242,272" fill="#94a3b8" />
  <polygon points="386,256 272,270 282,256 272,242" fill="#94a3b8" />
  <polygon points="126,256 240,270 230,256 240,242" fill="#94a3b8" />
  <!-- Central Pin -->
  <circle cx="256" cy="256" r="28" fill="#ffffff" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="14" fill="#0284c7" />
  <!-- Dynamic Globe Ring Arc -->
  <path d="M 176 256 A 80 80 0 1 1 336 256" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" />
</svg>
